[package]
name = "agentmeter"
version = "0.1.0"
description = "AgentMeter: a desktop sidebar showing how much of each AI coding agent's usage limit is left"
edition = "2021"
rust-version = "1.82"

[lib]
name = "agentmeter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentmeter-usage = { path = "../crates/agentmeter-usage" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
