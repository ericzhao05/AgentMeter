[package]
name = "agentmeter"
version = "0.1.0"
description = "AgentMeter: a desktop sidebar showing how much of each AI coding agent's usage limit is left"
edition = "2021"
rust-version = "1.77"

[lib]
name = "agentmeter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
